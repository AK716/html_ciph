<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Ordered list-->
    <h1>Countries in East Africa</h1>
    <ol>
        <li>Kenya</li>
        <li>Tanzania</li>
        <li>Uganda</li>
    </ol>
    <!--Unordered list-->
    <h2>Countries in Africa</h2>
    <ul>
        <li>South Sudan</li>
        <li>Namibia</li>
        <li>Algeria</li>
    </ul>
    <!--Decriptive list -->
    <h3>Descriptive Lists</h3>
    <dl>
        <dt> HTML</dt><br>
        <dd>Hyper Text Markup Language</dd><br>
        <dt>TREES</dt><br>
        <dd>They have green leaves and branches, some produce fruits like mango,banana etc..</dd>
    </dl>
</body>
</html>
