<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="static/css/form.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <div class="container">
        <div class="logo">CI</div>
        <h1>Create Account</h1>
        <p class=""subtitle>Join us today and get started</p>
        <form action=""method="post">
            <div class="input-group">
                <label for="fullname">fullname</label>
                <input type="text" id="fullname" name="fullname" 
                placeholder="Enter your name"><br><br>
            </div>
            <div class="input-group">
                <label for="email">email Address</label>
                <input type="email" id="email"  name="email"
                placeholder="Enter your email address"><br><br>
            </div>
            <div class="ino]put-group">
                <label for="pass">password</label>
                <input type="password" id="pass" name="password"
                placeholder="Enter your password"><br><br>
            </div>
            <div class="input-group">
                <label for="confpass">Confirm Password</label>
                <input type="password" id="confpass" name="confpass"
            placeholder="Confirm Password"><br> <br>

            </div>
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    I agree to the terms and conditions
                </label>
            </div>
            <button type="submit">Create Account</button>
        </form>

        <p class="login">Already have an account? <a href="">Login</a></p>

    </div>
</body>
</html>
